<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Request</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <style>
        body {
            background-color: #75767B;

        }
    </style>
</head>

<body>
    <div class="container" style="width: 100%; height: 100vh;">
        <div class="row">
            <div class="card" style="width: 60%; height: 100%; margin-top: 5%; margin-left: 20%;">
                <div class="card-header">
                    <div class="col-12" style="text-align: center">
                        <h1>Request A Course</h1>
                    </div>
                </div>
                <div class="card-body">
                    <div style="margin-left: 200px">
                        <form action="/submit-course-request" method="POST">
                            <div class="col-10 form-group" style="text-align: left">
                                <label for="country"><b>Country:</b></label><br>
                                <input type="text" id="country" name="country" required autocomplete="off"
                                    placeholder="Enter Country Name">
                            </div>
                            <div class="col-10 form-group" style="text-align: left">
                                <label for="courseType"><b>Course Type:</b></label><br>
                                <input type="text" id="courseType" name="courseType" required autocomplete="off"
                                    placeholder="Ex: M.Sc">
                            </div>
                            <div class="col-10 form-group" style="text-align: left">
                                <label for="courseName"><b>Course Specialization:</b></label><br>
                                <input type="text" id="courseName" name="courseName" required autocomplete="off"
                                    placeholder="Ex: M.Sc in Psychology"><br><br>
                                <button type="submit form-control" class="btn btn-warning"><b>Submit</b></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
        integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>



</body>

</html>
